# PR 构建检查：跑和 EdgeOne 相同的构建，失败日志在 PR 里就能看到。部署由 EdgeOne 连 Git 自动完成，这里不部署、不用任何密钥。
name: Build check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 城市站总部页：重新生成 hq/，和提交的内容不一致就失败（防止改了 hq-site/ 忘记重新生成）
      - name: Check hq/ is up to date
        run: |
          python3 hq-site/scripts/build.py
          python3 hq-site/scripts/check_dist.py
          if [ -n "$(git status --porcelain -- hq)" ]; then
            echo "::error::hq/ 与 hq-site/ 源码不一致，请运行 python3 hq-site/scripts/build.py 后一起提交"
            git status --porcelain -- hq | head -20
            exit 1
          fi
      - run: npm ci
      - run: npm run build
        env:
          CHECK_ALL_CITIES: "1"
