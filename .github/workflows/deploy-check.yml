# 每 15 分钟检查线上是否跟上 main，结果推到总部运维的 Uptime Kuma，告警发到飞书运维群。逻辑见 scripts/check-deploy.mjs。
# 公开仓库 60 天没有提交时，GitHub 会自动停用定时任务；那时 Kuma 因为收不到心跳而告警，到 Actions 页面重新启用即可。
name: Deploy check
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-check
jobs:
  check:
    if: github.repository == 'waytoagi-team/waytoagi-cities'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-deploy.mjs
        env:
          KUMA_PUSH_URL: ${{ secrets.KUMA_PUSH_URL }}
